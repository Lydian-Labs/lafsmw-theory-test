env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: firebase-api-key
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: firebase-auth-domain
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    secret: firebase-database-url
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: firebase-project-id
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: firebase-storage-bucket
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: firebase-messaging-sender-id
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: firebase-app-id
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    secret: firebase-measurement-id
  # Server-only (no NEXT_PUBLIC_ prefix so they never reach the browser)
  - variable: EMAIL_USER
    secret: email
    availability:
      - RUNTIME
  - variable: EMAIL_PASS
    secret: email-pass
    availability:
      - RUNTIME
  - variable: EMAIL_CAMP_DIRECTOR
    secret: email-camp-director
    availability:
      - RUNTIME
  - variable: EMAIL_DEVELOPER
    secret: email-developer
    availability:
      - RUNTIME
